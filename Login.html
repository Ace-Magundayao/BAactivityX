<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>

    <!-- CONNECT TO CSS -->
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <main class="container">

        <section class="form-box">

            <h1>Welcome Back!</h1>

            <p class="subtitle">
                Login to your account
            </p>


            <form id="loginForm">

                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email">

                    <p
                        id="emailError"
                        class="field-error">
                    </p>

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password">

                    <p
                        id="passwordError"
                        class="field-error">
                    </p>

                </div>


                <button type="submit">
                    Login
                </button>

            </form>


            <p class="account-text">

                Don't have an account?

                <a href="register.html">
                    Register here
                </a>

            </p>

        </section>

    </main>



    <script>

        const loginForm =
            document.getElementById("loginForm");

        const email =
            document.getElementById("email");

        const password =
            document.getElementById("password");

        const emailError =
            document.getElementById("emailError");

        const passwordError =
            document.getElementById("passwordError");



        function clearErrors() {

            emailError.textContent = "";

            passwordError.textContent = "";

            email.classList.remove("input-error");

            password.classList.remove("input-error");

        }


        function showError(
            input,
            errorElement,
            message
        ) {

            input.classList.add("input-error");

            errorElement.textContent = message;

        }

        loginForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                clearErrors();

                let valid = true;


                const emailValue =
                    email.value.trim();


                const emailPattern =
                    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


                if (emailValue === "") {

                    showError(
                        email,
                        emailError,
                        "Please enter your email."
                    );

                    valid = false;

                }

                else if (
                    !emailPattern.test(emailValue)
                ) {

                    showError(
                        email,
                        emailError,
                        "Please enter a valid email address."
                    );

                    valid = false;

                }

                const passwordValue =
                    password.value;


                if (passwordValue === "") {

                    showError(
                        password,
                        passwordError,
                        "Please enter your password."
                    );

                    valid = false;

                }


                if (!valid) {
                    return;
                }


                const registeredEmail =
                    localStorage.getItem(
                        "registeredEmail"
                    );

                const registeredPassword =
                    localStorage.getItem(
                        "registeredPassword"
                    );



                if (
                    !registeredEmail ||
                    !registeredPassword
                ) {

                    showError(
                        email,
                        emailError,
                        "No account found. Please register first."
                    );

                    return;
                }



                if (
                    emailValue !== registeredEmail
                ) {

                    showError(
                        email,
                        emailError,
                        "Email address is not registered."
                    );

                    return;
                }


                if (
                    passwordValue !== registeredPassword
                ) {

                    showError(
                        password,
                        passwordError,
                        "Incorrect password."
                    );

                    return;
                }


                localStorage.setItem("isLoggedIn", "true");

                window.location.href = "index.html";


            }
        );


        email.addEventListener(
            "input",
            function() {

                emailError.textContent = "";

                email.classList.remove(
                    "input-error"
                );

            }
        );



        password.addEventListener(
            "input",
            function() {

                passwordError.textContent = "";

                password.classList.remove(
                    "input-error"
                );

            }
        );

    </script>

</body>

</html>
