<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="form-box">

            <h1>Create Account</h1>
            <p class="subtitle">Register a new account</p>

            <form id="registerForm">

        
                <div class="input-group">

                    <label for="fullname">Full Name</label>

                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter your full name">

                    <p id="fullnameError" class="field-error"></p>

                </div>


                <div class="input-group">

                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email">

                    <p id="emailError" class="field-error"></p>

                </div>


                <div class="input-group">

                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password">

                    <p id="passwordError" class="field-error"></p>

                </div>



                <div class="input-group">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Confirm your password">

                    <p id="confirmPasswordError" class="field-error"></p>

                </div>


                <button type="submit">
                    Register
                </button>

            </form>


            <p class="account-text">

                Already have an account?

                <a href="login.html">
                    Login here
                </a>

            </p>

        </section>

    </main>


    <script>

        const registerForm =
            document.getElementById("registerForm");

        const fullname =
            document.getElementById("fullname");

        const email =
            document.getElementById("email");

        const password =
            document.getElementById("password");

        const confirmPassword =
            document.getElementById("confirm-password");


        const fullnameError =
            document.getElementById("fullnameError");

        const emailError =
            document.getElementById("emailError");

        const passwordError =
            document.getElementById("passwordError");

        const confirmPasswordError =
            document.getElementById("confirmPasswordError");


        /*
        ========================================
        CLEAR ERROR
        ========================================
        */

        function clearErrors() {

            fullnameError.textContent = "";
            emailError.textContent = "";
            passwordError.textContent = "";
            confirmPasswordError.textContent = "";

            fullname.classList.remove("input-error");
            email.classList.remove("input-error");
            password.classList.remove("input-error");
            confirmPassword.classList.remove("input-error");

        }


        /*
        ========================================
        SHOW ERROR
        ========================================
        */

        function showError(input, errorElement, message) {

            input.classList.add("input-error");

            errorElement.textContent = message;

        }


        /*
        ========================================
        REGISTER VALIDATION
        ========================================
        */

        registerForm.addEventListener("submit", function(event) {

            event.preventDefault();

            clearErrors();

            let valid = true;


            /*
            ====================================
            FULL NAME
            ====================================
            */

            const namePattern = /^[A-Za-z\s]+$/;

            if (fullname.value.trim() === "") {

                showError(
                    fullname,
                    fullnameError,
                    "Please enter your full name."
                );

                valid = false;

            }

            else if (!namePattern.test(fullname.value.trim())) {

                showError(
                    fullname,
                    fullnameError,
                    "Full name must contain letters only."
                );

                valid = false;

            }


            /*
            ====================================
            EMAIL
            ====================================
            */

            const emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


            if (email.value.trim() === "") {

                showError(
                    email,
                    emailError,
                    "Please enter your email."
                );

                valid = false;

            }

            else if (!emailPattern.test(email.value.trim())) {

                showError(
                    email,
                    emailError,
                    "Please enter a valid email address."
                );

                valid = false;

            }


            /*
            ====================================
            PASSWORD
            ====================================
            */

            if (password.value === "") {

                showError(
                    password,
                    passwordError,
                    "Please create a password."
                );

                valid = false;

            }

            else if (password.value.length < 6) {

                showError(
                    password,
                    passwordError,
                    "Password must be at least 6 characters."
                );

                valid = false;

            }


            /*
            ====================================
            CONFIRM PASSWORD
            ====================================
            */

            if (confirmPassword.value === "") {

                showError(
                    confirmPassword,
                    confirmPasswordError,
                    "Please confirm your password."
                );

                valid = false;

            }

            else if (
                password.value !== confirmPassword.value
            ) {

                showError(
                    confirmPassword,
                    confirmPasswordError,
                    "Passwords do not match."
                );

                valid = false;

            }


            /*
            ====================================
            CHECK EXISTING ACCOUNT
            ====================================
            */

            const registeredEmail =
                localStorage.getItem("registeredEmail");


            if (
                valid &&
                registeredEmail &&
                email.value.trim() === registeredEmail
            ) {

                showError(
                    email,
                    emailError,
                    "An account with this email already exists."
                );

                valid = false;

            }


            /*
            ====================================
            SAVE ACCOUNT
            ====================================
            */

            if (valid) {

                localStorage.setItem(
                    "registeredFullname",
                    fullname.value.trim()
                );

                localStorage.setItem(
                    "registeredEmail",
                    email.value.trim()
                );

                localStorage.setItem(
                    "registeredPassword",
                    password.value
                );


                window.location.href = "login.html";

            }

        });


        /*
        ========================================
        REMOVE ERROR WHEN USER STARTS TYPING
        ========================================
        */

        fullname.addEventListener("input", function() {

            fullnameError.textContent = "";
            fullname.classList.remove("input-error");

        });


        email.addEventListener("input", function() {

            emailError.textContent = "";
            email.classList.remove("input-error");

        });


        password.addEventListener("input", function() {

            passwordError.textContent = "";
            password.classList.remove("input-error");

        });


        confirmPassword.addEventListener("input", function() {

            confirmPasswordError.textContent = "";
            confirmPassword.classList.remove("input-error");

        });

    </script>

</body>
</html>
